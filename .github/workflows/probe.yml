name: Probe candidate boards

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node src/probe.mjs
      - name: Commit results
        run: |
          git config user.name "job-crawler-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe_results.json
          git diff --cached --quiet || { git commit -m "probe: candidate boards"; git pull --rebase -q; git push; }
